[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goai-official-faithful-scorer"
version = "1.1.0"
description = "Auditable validation-only six-module scorer for GOAI 2026 virtual yeast perturbation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
diagnostics = ["anndata>=0.11", "pertpy>=1.2"]

[project.scripts]
goai-score-validation = "goai_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
